# Each [[deviation]] is one symbol the parity suite (tests/parity/) does not require to
# match micropython-rp2-stubs. `status` says why it is allowed to differ:
#   - "documented": a design decision this repo's own docs explain. `quote` must be an
#     exact substring of README.md or docs/ (whitespace-normalized) -- the decision has to
#     actually be written down, not just asserted here.
#   - "tracked:#N": a real gap, not a decision -- filed as issue #N in
#     PyMCU/pymcu-micropython. No `quote` is required: there is no design rationale to
#     quote, only an issue to point at. `reason` names the issue.


